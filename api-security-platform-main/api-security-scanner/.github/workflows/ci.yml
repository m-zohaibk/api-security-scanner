name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install dev linting tools
          pip install ruff black

      - name: Prepare synthetic model artifacts for preflight
        run: |
          mkdir -p models
          echo dummy > models/isolation_forest.pkl
          echo dummy > models/lstm_model.pt
          echo dummy > models/autoencoder.pt
          echo '{}' > models/char_vocab.json
          echo dummy > models/feature_scaler.pkl
          echo dummy > models/autoencoder_scaler.pkl
          echo 1.0 > models/autoencoder_threshold.txt

      - name: Create safe docker-compose for preflight
        run: |
          echo "version: '3.8'\nservices:\n  api-scanner:\n    image: example/api-scanner:latest" > safe-docker-compose.yml

      - name: Create secure .env for preflight
        run: |
          echo SECRET_KEY=abcdefghijklmnopqrstuvwxyz1234567890 > .env

      - name: Run preflight checker
        run: |
          python tools/check_environment.py --models-dir models --compose-path safe-docker-compose.yml --env-path .env

      - name: Run linters
        run: |
          ruff check . || true
          black --check . || true

      - name: Run fast tests
        run: |
          pytest -q tests/test_core.py tests/test_feature_vector.py tests/test_setup.py tests/test_dashboard.py tests/test_database.py tests/test_preflight.py
